<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdRoll Home</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .hero {
      background-color: #1f3a44;
      background-image: url(newww.jpg);
      color: white;
      text-align: center;
      padding: 120px 20px;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: 70px;
      margin: 0;
    }

    .hero p {
      font-size: 20px;
      margin: 30px 0;
    }

    .demo-button {
      display: inline-block;
      background-color: #f5c842;
      color: #1a2b6d;
      font-size: 20px;
      font-weight: bold;
      padding: 18px 50px;
      border-radius: 40px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <nav class="bg-white border-gray-200">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">

      <a href="#" class="text-2xl font-bold text-gray-900">AdRoll</a>

      <div class="flex items-center md:order-2 space-x-3">
        <a href="#" class="text-blue-900 font-bold">Log in</a>
        <a href="#" class="bg-yellow-400 text-blue-900 font-bold rounded-full px-5 py-2">Get Started</a>

        <button data-collapse-toggle="navbar-cta" type="button"
          class="inline-flex items-center p-2 w-10 h-10 justify-center text-gray-500 rounded-lg md:hidden hover:bg-gray-100"
          aria-controls="navbar-cta" aria-expanded="false">
          <span class="sr-only">Open main menu</span>
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
          </svg>
        </button>
      </div>

      <div class="hidden items-center justify-between w-full md:flex md:w-auto md:order-1" id="navbar-cta">
        <ul class="flex flex-col font-medium p-4 md:p-0 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 md:flex-row md:mt-0 md:border-0 md:bg-white">
          <li><a href="#" class="block py-2 px-3 text-gray-700 hover:text-blue-600">Why AdRoll</a></li>
          <li><a href="#" class="block py-2 px-3 text-gray-700 hover:text-blue-600">Products</a></li>
          <li><a href="#" class="block py-2 px-3 text-gray-700 hover:text-blue-600">Industries</a></li>
          <li><a href="#" class="block py-2 px-3 text-gray-700 hover:text-blue-600">Pricing</a></li>
          <li><a href="#" class="block py-2 px-3 text-gray-700 hover:text-blue-600">Resources</a></li>
        </ul>
      </div>

    </div>
  </nav>

  <div class="hero">
    <h1>Work smarter.<br>Move faster.<br>Advertise <i>better.</i></h1>
    <p>Drive more revenue with the multichannel advertising platform for savvy marketers.</p>
    <a href="#" class="demo-button">Request a Demo</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</body>
</html>
